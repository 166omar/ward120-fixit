<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1C3A">
<title>Ward 120 Doorstep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo+Black&display=swap">
<style>
:root{
  --navy:#0E1C3A; --blue:#1BA0DE; --blue-d:#1278B9; --yellow:#FFD400;
  --ground:#EEF3F8; --card:#FFFFFF; --ink:#0E1C3A; --muted:#55627A; --line:#D5DEEA;
  --yes:#1E8E4E; --maybe:#C98500; --no:#C23B3B; --away:#6B7690;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.4;
  background:var(--ground);color:var(--ink);-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
h1,h2,.display{font-family:"Archivo Black","Atkinson Hyperlegible",system-ui,sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 0 16px}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);font-weight:700}
.who{font-size:14px;opacity:.85;background:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;color:#fff}
.score{margin-top:10px}
.score .big{font-family:"Archivo Black",sans-serif;font-size:44px;line-height:1}
.score .of{font-size:16px;opacity:.8}
.bar{height:14px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:99px;width:0;transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stats div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;opacity:.8}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:12px 4px 14px;font-weight:700;font-size:15px;color:var(--muted);border-top:4px solid transparent}
.tabs button[aria-selected="true"]{color:var(--navy);border-top-color:var(--blue)}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:16px}
.search{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.area{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 4px 8px}
.street{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.street .nm{flex:1;min-width:0}
.street .nm b{display:block;font-size:18px}
.street .nm small{color:var(--muted);font-size:14px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--away)}
.dot.started{background:var(--yellow);border-color:var(--maybe)}
.dot.done{background:var(--yes);border-color:var(--yes)}
.pill{font-weight:700;font-size:14px;border-radius:999px;padding:3px 10px;background:#E4F4EA;color:var(--yes);white-space:nowrap}
.back{background:none;border:0;color:var(--blue-d);font-weight:700;padding:14px 0;font-size:17px}
.sthead h2{font-size:28px;line-height:1.1}
.sthead p{margin:6px 0 0;color:var(--muted)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.links a{color:var(--blue-d);font-weight:700}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
.inp{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);font-size:20px;background:#fff}
.inp:focus{border-color:var(--blue)}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big4 button{border:0;border-radius:16px;padding:18px 8px;color:#fff;font-weight:700;font-size:19px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.big4 button small{font-weight:400;font-size:13px;opacity:.9}
.b-yes{background:var(--yes)} .b-maybe{background:var(--maybe)} .b-no{background:var(--no)} .b-away{background:var(--away)}
.consent{border:2px dashed var(--blue);border-radius:14px;padding:14px;background:#F2FAFE}
.check{display:flex;gap:12px;align-items:flex-start;font-size:17px;padding:6px 0}
.check input{width:26px;height:26px;flex:none;margin-top:1px;accent-color:var(--navy)}
.say{background:#FFF8D6;border:1px solid #F0DC7A;border-radius:14px;padding:14px;font-size:16px}
.say b{display:block;margin-bottom:4px}
.primary{width:100%;border:0;border-radius:14px;padding:16px;background:var(--navy);color:#fff;font-weight:700;font-size:19px}
.ghost{width:100%;border:2px solid var(--navy);border-radius:14px;padding:14px;background:none;font-weight:700;font-size:17px}
.door{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.door:last-child{border-bottom:0}
.door .res{font-weight:700;border-radius:8px;padding:2px 8px;color:#fff;font-size:14px;flex:none}
.door .tx{flex:1;min-width:0;font-size:15px}
.door .tx small{display:block;color:var(--muted)}
.undo{background:none;border:0;color:var(--no);font-weight:700;font-size:14px}
.person{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.person.voted{opacity:.55}
.person .tx{flex:1;min-width:0}
.person .tx b{font-size:18px}
.person .tx small{display:block;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:4px;background:var(--yellow);color:var(--navy)}
.vbtn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:var(--yes);color:#fff;font-size:16px;flex:none}
.vbtn.undo2{background:var(--line);color:var(--ink)}
.phone{font-weight:700;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;max-width:calc(100% - 32px);text-align:center}
.err{color:var(--no);font-weight:700;margin:8px 0 0}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-block:24px}
.login h1{font-size:34px;line-height:1.05}
.login .slogan{color:var(--muted);margin:10px 0 20px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js?v=3"></script>
<script>
(function () {
  "use strict";
  const sb = window.supabase.createClient(W120.SUPABASE_URL, W120.SUPABASE_ANON_KEY);
  const app = document.getElementById("app");
  const store = {
    get(k) { try { return localStorage.getItem("gotv_" + k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { localStorage.setItem("gotv_" + k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem("gotv_" + k); } catch (e) {} }
  };
  const S = { code: store.get("code"), name: store.get("name"), tab: "streets", filter: "all", q: "",
              state: null, street: null, streetData: null, people: null, pfilter: "todo" };
  const RES = { yes: ["YES", "var(--yes)"], maybe: ["MAYBE", "var(--maybe)"], no: ["NO", "var(--no)"], not_home: ["NOT HOME", "var(--away)"] };

  // tiny DOM helper: every piece of user text goes in through textContent
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "style") el.setAttribute("style", v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
    return el;
  }
  function toast(msg) {
    const t = h("div", { class: "toast", role: "status" }, msg);
    document.body.append(t); setTimeout(() => t.remove(), 2200);
  }
  async function rpc(fn, args) {
    const { data, error } = await sb.rpc(fn, Object.assign({ p_code: S.code }, args || {}));
    if (error) throw new Error("No connection. Check your data and try again.");
    if (data && data.error === "bad_code") { logout("Team code not accepted. Check it, or wait 10 minutes."); throw new Error("bad_code"); }
    return data;
  }
  function logout(msg) { store.del("code"); S.code = ""; renderLogin(msg); }

  // ---------- login ----------
  function renderLogin(msg) {
    app.replaceChildren();
    const code = h("input", { id: "code", class: "inp", autocomplete: "off", autocapitalize: "characters", placeholder: "e.g. WORD-1234", value: S.code });
    const name = h("input", { id: "vname", class: "inp", autocomplete: "given-name", placeholder: "Your first name", value: S.name });
    const err = h("p", { class: "err", role: "alert" }, msg || "");
    const go = h("button", { class: "primary", type: "submit" }, "Start");
    const form = h("form", { class: "stack", onsubmit: async (e) => {
      e.preventDefault(); err.textContent = "";
      if (!name.value.trim()) { err.textContent = "Type your first name so the team knows who knocked."; return; }
      go.disabled = true; go.textContent = "Checking…";
      S.code = code.value.trim().toUpperCase(); S.name = name.value.trim();
      try {
        const r = await sb.rpc("gotv_login", { p_code: S.code });
        if (r.error) throw new Error("No connection. Check your data and try again.");
        if (!r.data || !r.data.ok) { err.textContent = "Team code not accepted. Check it, or wait 10 minutes."; return; }
        store.set("code", S.code); store.set("name", S.name); loadHome();
      } catch (x) { err.textContent = x.message; }
      finally { go.disabled = false; go.textContent = "Start"; }
    } },
      h("div", null, h("label", { class: "lbl", for: "code" }, "Team code"), code),
      h("div", null, h("label", { class: "lbl", for: "vname" }, "Your name"), name),
      err, go);
    app.append(h("div", { class: "wrap login" },
      h("div", { class: "brand", style: "color:var(--blue-d)" }, "TRUTH · Ward 120 · 4 Nov 2026"),
      h("h1", { class: "mt" }, "Ward 120 Doorstep"),
      h("p", { class: "slogan" }, "Find every supporter. Get every one of them to vote."),
      form));
  }

  // ---------- shell ----------
  function header() {
    const t = S.state.totals, found = t.yes, target = S.state.target || 3200;
    const pct = Math.min(100, Math.round(found / target * 100));
    const bar = h("i"); requestAnimationFrame(() => { bar.style.width = pct + "%"; });
    return h("header", { class: "top" }, h("div", { class: "wrap" },
      h("div", { class: "row" }, h("div", { class: "brand" }, "Ward 120 Doorstep"),
        h("button", { class: "who", onclick: () => logout("") , "aria-label": "Sign out" }, S.name + " · sign out")),
      h("div", { class: "score" },
        h("span", { class: "big" }, found.toLocaleString("en-ZA")), " ",
        h("span", { class: "of" }, "supporters found · need about " + target.toLocaleString("en-ZA"))),
      h("div", { class: "bar", role: "progressbar", "aria-valuenow": pct, "aria-valuemin": 0, "aria-valuemax": 100 }, bar),
      h("div", { class: "stats" },
        h("div", null, h("b", null, t.doors), h("span", null, "doors")),
        h("div", null, h("b", null, t.maybe), h("span", null, "maybe")),
        h("div", null, h("b", null, t.streets_done + "/" + t.streets), h("span", null, "streets done")),
        h("div", null, h("b", null, t.voted + "/" + t.people), h("span", null, "voted")))));
  }
  function tabs() {
    const b = (id, label) => h("button", { role: "tab", "aria-selected": S.tab === id ? "true" : "false",
      onclick: () => { S.tab = id; S.street = null; id === "day" ? loadPeople() : render(); } }, label);
    return h("nav", { class: "tabs", role: "tablist" }, b("streets", "🚪 Streets"), b("day", "🗳️ Voting day"), b("help", "💬 What to say"));
  }
  async function loadHome() {
    try { S.state = await rpc("gotv_state"); render(); } catch (e) { if (e.message !== "bad_code") toast(e.message); }
  }
  function render() {
    if (!S.state) return;
    app.replaceChildren(header());
    const main = h("main", { class: "wrap" });
    if (S.street) main.append(streetView());
    else if (S.tab === "streets") main.append(streetsView());
    else if (S.tab === "day") main.append(dayView());
    else main.append(helpView());
    app.append(main, tabs());
  }

  // ---------- streets list ----------
  function streetsView() {
    const box = h("div", { class: "stack mt" });
    const search = h("input", { id: "q", class: "search", type: "search", placeholder: "Find a street…", value: S.q,
      oninput: (e) => { S.q = e.target.value; list.replaceChildren(...rows()); } });
    const chip = (id, label) => h("button", { class: "chip", "aria-pressed": S.filter === id ? "true" : "false",
      onclick: () => { S.filter = id; render(); } }, label);
    const list = h("div");
    function rows() {
      const q = S.q.trim().toLowerCase();
      const ss = S.state.streets.filter(s => (S.filter === "all" || s.status === S.filter) &&
        (!q || s.name.toLowerCase().includes(q) || (s.area || "").toLowerCase().includes(q)));
      if (!ss.length) return [h("p", { class: "empty" }, "No streets match.")];
      const out = []; let area = null;
      for (const s of ss) {
        if (s.area !== area) { area = s.area; out.push(h("div", { class: "area" }, area)); }
        out.push(h("button", { class: "street", onclick: () => openStreet(s.id) },
          h("span", { class: "dot " + s.status, "aria-label": s.status === "todo" ? "not started" : s.status }),
          h("span", { class: "nm" }, h("b", null, s.name),
            h("small", null, (s.doors ? s.doors + " doors · " : "") + "votes at " + s.station)),
          s.yes ? h("span", { class: "pill" }, "✓ " + s.yes) : null));
      }
      return out;
    }
    list.append(...rows());
    box.append(search, h("div", { class: "chips" }, chip("all", "All"), chip("todo", "Not started"), chip("started", "Started"), chip("done", "Done")), list);
    return box;
  }

  // ---------- one street ----------
  async function openStreet(id) {
    S.nextHouse = "";
    S.street = S.state.streets.find(s => s.id === id); S.streetData = null; render(); window.scrollTo(0, 0);
    try { S.streetData = await rpc("gotv_street", { p_street: id }); render(); } catch (e) { if (e.message !== "bad_code") toast(e.message); }
  }
  function streetView() {
    const s = S.street;
    const box = h("div", { class: "stack" });
    box.append(h("button", { class: "back", onclick: () => { S.street = null; loadHome(); } }, "← All streets"));
    box.append(h("div", { class: "sthead" }, h("h2", null, s.name),
      h("p", null, s.area + " · votes at " + s.station + (s.metres ? " · " + s.metres + " m" : "")),
      h("div", { class: "links" }, h("a", { href: "https://maps.google.com/?q=" + s.lat + "," + s.lng, target: "_blank", rel: "noopener" }, "Open in Maps ↗"))));

    const house = h("input", { id: "house", class: "inp", inputmode: "text", placeholder: "House number", autocomplete: "off", value: S.nextHouse || "" });
    const fname = h("input", { id: "fname", class: "inp", placeholder: "First name only", autocomplete: "off" });
    const phone = h("input", { id: "phone", class: "inp", type: "tel", inputmode: "tel", placeholder: "Cell number", autocomplete: "off" });
    const details = h("div", { class: "stack", hidden: true });
    const consent = h("input", { id: "consent", type: "checkbox", onchange: () => { details.hidden = !consent.checked; if (consent.checked) fname.focus(); } });
    const lift = h("input", { id: "lift", type: "checkbox" });
    const special = h("input", { id: "special", type: "checkbox" });
    const extra = h("div", { class: "consent stack" },
      h("div", null, "“Can we save your first name and number to remind you on voting day? We delete it after the election.”"),
      h("label", { class: "check" }, consent, h("span", null, h("b", null, "They said YES"), " — save their details")),
      details);
    details.append(
      h("div", null, h("label", { class: "lbl", for: "fname" }, "First name"), fname),
      h("div", null, h("label", { class: "lbl", for: "phone" }, "Cell number"), phone),
      h("label", { class: "check" }, lift, h("span", null, "🚗 Needs a lift on 4 Nov")),
      h("label", { class: "check" }, special, h("span", null, "🏠 Can't get out — special vote (2–3 Nov)")));

    async function log(result, btn) {
      if (consent.checked && !fname.value.trim()) { toast("Type their first name, or untick the box."); fname.focus(); return; }
      btn.disabled = true;
      try {
        await rpc("gotv_log_door", { p_street: s.id, p_house: house.value, p_result: result, p_note: null, p_volunteer: S.name,
          p_name: consent.checked ? fname.value : null, p_phone: consent.checked ? phone.value : null,
          p_consent: consent.checked, p_lift: lift.checked, p_special: special.checked });
        toast((house.value ? "No. " + house.value + " · " : "") + RES[result][0] + " saved");
        const bumped = house.value.trim().match(/^(\d+)$/);   // step to the next house on this side of the street
        S.nextHouse = bumped ? String(+bumped[1] + 2) : "";
        S.streetData = await rpc("gotv_street", { p_street: s.id });
        const st = await rpc("gotv_state"); S.state = st; S.street = st.streets.find(x => x.id === s.id); render();
        document.getElementById("house")?.focus();
      } catch (e) { if (e.message !== "bad_code") toast(e.message); btn.disabled = false; }
    }
    const big = (res, cls, label, sub) => { const b = h("button", { class: cls, onclick: () => log(res, b) }, label, h("small", null, sub)); return b; };

    box.append(h("div", { class: "card stack" },
      h("div", null, h("label", { class: "lbl", for: "house" }, "1. House number"), house),
      h("div", null, h("div", { class: "lbl" }, "2. Want a reminder on voting day? (ask YES / MAYBE voters)")),
      extra,
      h("div", null, h("div", { class: "lbl" }, "3. Will they vote for Omar?")),
      h("div", { class: "big4" },
        big("yes", "b-yes", "✅ YES", "supporter"), big("maybe", "b-maybe", "🤔 MAYBE", "come back"),
        big("no", "b-no", "❌ NO", "move on"), big("not_home", "b-away", "🚪 NOT HOME", "try again"))));

    const d = S.streetData;
    const list = h("div", { class: "card" }, h("div", { class: "lbl" }, "Knocked on this street"));
    if (!d) list.append(h("p", { class: "muted" }, "Loading…"));
    else if (!d.doors.length) list.append(h("p", { class: "muted" }, "Nobody yet. You're first."));
    else {
      const names = {}; d.people.forEach(p => { if (p.door_id) names[p.door_id] = p; });
      d.doors.slice(0, 40).forEach(dr => {
        const p = names[dr.id];
        list.append(h("div", { class: "door" },
          h("span", { class: "res", style: "background:" + RES[dr.result][1] }, RES[dr.result][0]),
          h("span", { class: "tx" }, dr.house_no ? "No. " + dr.house_no : "No number",
            h("small", null, (p ? p.first_name + " · " : "") + (dr.volunteer || "") + " · " +
              new Date(dr.created_at).toLocaleString("en-ZA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))),
          h("button", { class: "undo", onclick: async (e) => {
            e.currentTarget.disabled = true;
            try { await rpc("gotv_undo_door", { p_door: dr.id }); toast("Removed"); S.streetData = await rpc("gotv_street", { p_street: s.id }); render(); }
            catch (x) { if (x.message !== "bad_code") toast(x.message); }
          } }, "Undo")));
      });
    }
    box.append(list);
    const next = s.status === "done" ? ["todo", "Re-open this street"] : ["done", "✔ This street is finished"];
    box.append(h("button", { class: "ghost", onclick: async () => {
      try { await rpc("gotv_set_street", { p_street: s.id, p_status: next[0], p_volunteer: S.name }); toast(next[0] === "done" ? "Street done. Well done!" : "Street re-opened"); S.street = null; S.tab = "streets"; loadHome(); }
      catch (x) { if (x.message !== "bad_code") toast(x.message); }
    } }, next[1]));
    return box;
  }

  // ---------- voting day ----------
  async function loadPeople() {
    S.people = null; render();
    try { S.people = await rpc("gotv_people_all"); render(); } catch (e) { if (e.message !== "bad_code") toast(e.message); }
  }
  function dayView() {
    const box = h("div", { class: "stack mt" });
    if (!S.people) { box.append(h("p", { class: "empty" }, "Loading…")); return box; }
    const chip = (id, label) => h("button", { class: "chip", "aria-pressed": S.pfilter === id ? "true" : "false",
      onclick: () => { S.pfilter = id; render(); } }, label);
    const n = S.people.length, voted = S.people.filter(p => p.voted).length;
    box.append(h("div", { class: "card" }, h("b", null, voted + " of " + n + " supporters have voted"),
      h("p", { class: "muted", style: "margin:4px 0 0" }, "On 4 Nov: call everyone still on the list. Tick them when they've voted.")));
    box.append(h("div", { class: "chips" }, chip("todo", "Still to vote"), chip("lift", "🚗 Needs lift"), chip("special", "🏠 Special vote"), chip("voted", "Voted")));
    const ps = S.people.filter(p => S.pfilter === "todo" ? !p.voted : S.pfilter === "voted" ? p.voted : S.pfilter === "lift" ? p.needs_lift && !p.voted : p.special_vote);
    if (!ps.length) { box.append(h("p", { class: "empty" }, n ? "Nobody in this list." : "No supporters saved yet. They appear here when a voter says yes to a reminder.")); return box; }
    let st = null;
    for (const p of ps) {
      if (p.station !== st) { st = p.station; box.append(h("div", { class: "area" }, "Votes at " + st)); }
      box.append(h("div", { class: "person" + (p.voted ? " voted" : "") },
        h("div", { class: "tx" }, h("b", null, p.first_name),
          h("small", null, (p.house_no ? p.house_no + " " : "") + p.street),
          p.phone ? h("small", null, h("span", { class: "phone" }, p.phone), " · ", h("a", { href: "tel:" + p.phone }, "call"), " · ",
            h("a", { href: "https://wa.me/" + p.phone.replace(/^0/, "27").replace(/\D/g, ""), target: "_blank", rel: "noopener" }, "WhatsApp")) : null,
          h("div", null, p.needs_lift ? h("span", { class: "tag" }, "LIFT") : null, p.special_vote ? h("span", { class: "tag" }, "SPECIAL VOTE") : null)),
        h("button", { class: "vbtn" + (p.voted ? " undo2" : ""), onclick: async (e) => {
          e.currentTarget.disabled = true;
          try { await rpc("gotv_mark_voted", { p_person: p.id, p_voted: !p.voted, p_volunteer: S.name }); p.voted = !p.voted; toast(p.voted ? p.first_name + " voted ✓" : "Unmarked");
                S.state = await rpc("gotv_state"); render(); }
          catch (x) { if (x.message !== "bad_code") toast(x.message); }
        } }, p.voted ? "Undo" : "✓ Voted")));
    }
    return box;
  }

  // ---------- what to say ----------
  function helpView() {
    const say = (t, b) => h("div", { class: "say" }, h("b", null, t), b);
    return h("div", { class: "stack mt" },
      say("1 · Hello", "“Hi, I'm " + (S.name || "…") + ", I'm with Omar Khan — he's standing for Ward 120 councillor, TRUTH and Solidarity Movement.”"),
      say("2 · Ask", "“Are you registered to vote on 4 November? Can Omar count on your vote?”"),
      say("3 · One line", "“Omar says: work for me for 1 day, I will work for you for 5 years. You can find him at Khan's, NTN Centre, every day.”"),
      say("4 · Reminder (only if YES or MAYBE)", "“Can we save your first name and number to remind you on voting day? We delete it after the election.” — only tick the box if they say yes."),
      h("div", { class: "card stack" },
        h("b", null, "Rules"),
        h("div", null, "• Be polite. If they say no, thank them and move on. Never argue."),
        h("div", null, "• Save a name and number ONLY when they agree. No ID numbers, ever."),
        h("div", null, "• Never promise money, food or favours for a vote. That's against the law."),
        h("div", null, "• Nothing inside a voting station on 4 Nov. Lifts drop people at the gate."),
        h("div", null, "• Special votes are on 2 and 3 Nov for people who can't get out.")),
      h("p", { class: "muted", style: "font-size:14px" }, "Details are kept only to remind supporters to vote, and are deleted after the election."));
  }

  // keep the scoreboard fresh while the page is open
  setInterval(() => { if (S.code && S.state && !S.street && S.tab === "streets" && document.visibilityState === "visible") loadHome(); }, 45000);
  S.code ? loadHome() : renderLogin("");
})();
</script>
</body>
</html>
